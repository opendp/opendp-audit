name: Candidate defect
description: Track a distinct suspected OpenDP defect, including an unverified hypothesis
body:
  - type: markdown
    attributes:
      value: |
        Use audit-task issues to coordinate reviews. Candidate defects may remain unverified.
        Check open and closed audit issues, upstream issues, and merged/open PRs first.
        Follow OpenDP's security policy for sensitive vulnerabilities.
  - type: textarea
    id: hypothesis
    attributes:
      label: Suspected invariant violation
      description: What property may fail, for which inputs or assumptions?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Affected OpenDP commit SHA
      description: Full commit SHA of the code inspected, not just a branch name
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected paths and symbols
      description: Commit-pinned source links and audit report/investigation links
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction, reasoning, or evidence gap
      description: Separate executed tests from hypotheses and missing checks
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: Verification
      options:
        - Candidate
        - Reproduced
        - Confirmed
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Upstream disposition
      options:
        - Unreported
        - Existing issue
        - Pending PR
        - Fixed on main
        - Invalid
        - Duplicate
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related audit issues and upstream issues/PRs
      description: Include known duplicates, open fixes, and whether the fix has merged
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact and next decisive check
      description: Privacy, correctness, safety, utility, usability, or performance; concrete validation step
    validations:
      required: false
