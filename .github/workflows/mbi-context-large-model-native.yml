name: Probe high-level Context MBI reuse with public large model

on:
  push:
    paths:
      - '.github/workflows/mbi-context-large-model-native.yml'
      - 'tools/integration/mbi_context_large_public_prior_native.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=2'
      JAX_ENABLE_X64: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native OpenDP, MBI, and Polars
        run: |
          python -m pip install 'opendp==0.16.0a20261122001' 'mbi==2.0.0' 'numpy==2.3.5' 'polars==1.36.1'
      - name: Probe Context contingency table on neighboring public-model inputs
        run: |
          python -u tools/integration/mbi_context_large_public_prior_native.py
