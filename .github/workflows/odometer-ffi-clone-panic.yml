name: Verify pinned OpenDP odometer FFI wrong-query abort

on:
  push:
    paths:
      - '.github/workflows/odometer-ffi-clone-panic.yml'
      - 'tools/integration/odometer_ffi_clone_panic.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-opendp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audit test
        uses: actions/checkout@v4
      - name: Checkout pinned upstream OpenDP
        uses: actions/checkout@v4
        with:
          repository: opendp/opendp
          ref: ef1a238634d6196b01a1a1e77d3d5ad2340e3094
          path: opendp-upstream
          persist-credentials: false
      - name: Verify pinned SHA and install standalone regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C opendp-upstream rev-parse HEAD)" = "ef1a238634d6196b01a1a1e77d3d5ad2340e3094"
          mkdir -p opendp-upstream/rust/tests
          cp tools/integration/odometer_ffi_clone_panic.rs opendp-upstream/rust/tests/
      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Execute native wrong-query FFI abort regression
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
          RUSTFLAGS: '-C debuginfo=0'
        run: |
          set -euo pipefail
          ulimit -c 0
          cargo test --manifest-path opendp-upstream/rust/Cargo.toml \
            --no-default-features --features contrib,ffi \
            --test odometer_ffi_clone_panic -- --nocapture
