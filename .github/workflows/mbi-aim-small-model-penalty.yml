name: Verify AIM small-model extreme-penalty privacy accounting

on:
  push:
    paths:
      - '.github/workflows/mbi-aim-small-model-penalty.yml'
      - 'tools/integration/mbi_aim_small_total_large_penalty_native.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aim-small-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=2'
      JAX_ENABLE_X64: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native OpenDP, Polars, MBI
        run: |
          python -m pip install 'opendp==0.16.0a20261122001' 'polars==1.36.1' 'numpy==2.3.5' 'mbi==2.0.0'
      - name: Test native AIM scores, selection, and high-level release
        run: |
          python -u tools/integration/mbi_aim_small_total_large_penalty_native.py
