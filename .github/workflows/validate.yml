name: Validate audit records

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/tests -v
      - name: Check geometric interval width arithmetic in native Rust
        run: |
          rustc --edition=2021 --test tools/tests/geometric_trial_width.rs -o "$RUNNER_TEMP/geometric_trial_width"
          "$RUNNER_TEMP/geometric_trial_width"
      - name: Check b-ary consistency overflow arithmetic in native Rust
        run: |
          rustc --edition=2021 --test tools/tests/bary_consistency_float_overflow.rs -o "$RUNNER_TEMP/bary_consistency_float_overflow"
          "$RUNNER_TEMP/bary_consistency_float_overflow"
      - name: Check float threshold post-rounding alias in native Rust
        run: |
          rustc --edition=2021 --test tools/tests/float_threshold_postrounding.rs -o "$RUNNER_TEMP/float_threshold_postrounding"
          "$RUNNER_TEMP/float_threshold_postrounding"
      - name: Check integer threshold post-saturation alias in native Rust
        run: |
          rustc --edition=2021 --test tools/tests/integer_threshold_postsaturation.rs -o "$RUNNER_TEMP/integer_threshold_postsaturation"
          "$RUNNER_TEMP/integer_threshold_postsaturation"
      - run: python tools/validate.py
