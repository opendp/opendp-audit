name: Test independent SSCP regression and PCA stacks

on:
  push:
    paths:
      - '.github/workflows/pca-gaussian-sscp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENDP_TEST_RELEASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: opendp/opendp
          ref: 30ea684d721ae7199327f6a1d1b3fc2535484890
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Install dependencies
        run: python -m pip install -e 'python[scikit-learn]' pytest
      - name: Test shared SSCP infrastructure and legacy compatibility
        run: |
          cd python
          python -m pytest -v test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_sklearn_estimator.py test/extras/test_eigenvalues_numpy.py test/extras/test_eigenvector_numpy.py
      - name: Check out linear regression
        run: |
          git fetch --no-tags --depth=1 origin b9d685e20a81708c4cf3a5b36792398a916f0cbe
          git reset --hard FETCH_HEAD
      - name: Test linear regression
        run: |
          cd python
          python -m pytest -v test/extras/test_linear_regression_adassp.py
  pca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENDP_TEST_RELEASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: opendp/opendp
          ref: 30ea684d721ae7199327f6a1d1b3fc2535484890
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Install dependencies
        run: python -m pip install -e 'python[scikit-learn]' pytest
      - name: Check out SSCP-only decomposition2
        run: |
          git fetch --no-tags --depth=1 origin 039b9bb96a42fbd90a571a5db194f1bc0fdd3e58
          git reset --hard FETCH_HEAD
      - name: Test SSCP-only decomposition2
        run: |
          cd python
          python -m pytest -v test/extras/test_pca2_numpy.py test/extras/test_gaussian_pca.py test/extras/test_pca_numpy.py test/extras/test_count_numpy.py
      - name: Check out PCA consolidation
        run: |
          git fetch --no-tags --depth=1 origin 45351cbdf544098de1c61c682b9c3f4000b787b9
          git reset --hard FETCH_HEAD
      - name: Test PCA consolidation
        run: |
          cd python
          python -m pytest -v test/extras/test_pca_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out nuclear distance
        run: |
          git fetch --no-tags --depth=1 origin 2e3cae49f7448e59ed1fe9f77cebbb109a01b1d5
          git reset --hard FETCH_HEAD
      - name: Rebuild for nuclear distance
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Test nuclear distance
        run: |
          cd python
          python -m pytest -v test/extras/test_pca_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out scale-based Bingham
        run: |
          git fetch --no-tags --depth=1 origin f362fd3dbc6c4307efcb570aaa123db79d2e7732
          git reset --hard FETCH_HEAD
      - name: Test scale-based Bingham
        run: |
          cd python
          python -m pytest -v test/extras/test_pca_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out unknown-size Bingham
        run: |
          git fetch --no-tags --depth=1 origin 7c6ffed211d29996593dbcadbe4c87dbcd2fad54
          git reset --hard FETCH_HEAD
      - name: Test unknown-size Bingham
        run: |
          cd python
          python -m pytest -v test/extras/test_pca_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out certified Bingham
        run: |
          git fetch --no-tags --depth=1 origin 39903ef75221ec8a64e59b9c68dae9185ca68e94
          git reset --hard FETCH_HEAD
      - name: Rebuild for certified Bingham
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Test certified Bingham
        run: |
          cd python
          python -m pytest -v test/extras/test_pca_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Test certified sampler
        run: |
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib bingham
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib karney
