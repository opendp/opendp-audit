name: Test independent SSCP regression and PCA stacks

on:
  push:
    paths:
      - '.github/workflows/pca-gaussian-sscp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENDP_TEST_RELEASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: opendp/opendp
          ref: 2ba56a6fd845309f462cb832a4e3452f1a873d2b
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Install dependencies
        run: python -m pip install -e 'python[scikit-learn]' pytest
      - name: Test nuclear-distance refactor with legacy PCA
        run: |
          cd python
          python -m pytest -v test/extras/test_pca_numpy.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py
      - name: Check out shared SSCP infrastructure
        run: |
          git fetch --no-tags --depth=1 origin 79e81cc77306ee9871c5a2831b1bffab44ade913
          git reset --hard FETCH_HEAD
      - name: Test shared SSCP infrastructure and legacy compatibility
        run: |
          cd python
          python -m pytest -v test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_np_joint_moments.py test/extras/test_sklearn_estimator.py test/extras/test_eigenvalues_numpy.py test/extras/test_eigenvector_numpy.py
      - name: Check out linear regression
        run: |
          git fetch --no-tags --depth=1 origin a160ddda791cb8d8659808c69139c0a7061563e9
          git reset --hard FETCH_HEAD
      - name: Test linear regression
        run: |
          cd python
          python -m pytest -v test/extras/test_linear_regression_adassp.py
  pca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENDP_TEST_RELEASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: opendp/opendp
          ref: 2ba56a6fd845309f462cb832a4e3452f1a873d2b
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Install dependencies
        run: python -m pip install -e 'python[scikit-learn]' pytest
      - name: Check out shared SSCP infrastructure
        run: |
          git fetch --no-tags --depth=1 origin 79e81cc77306ee9871c5a2831b1bffab44ade913
          git reset --hard FETCH_HEAD
      - name: Check out SSCP-only decomposition2
        run: |
          git fetch --no-tags --depth=1 origin c0e85d8a8356453c0da9920f8a625c8f09c64489
          git reset --hard FETCH_HEAD
      - name: Test SSCP-only decomposition2
        run: |
          cd python
          python -m pytest -v test/extras/test_pca2_numpy.py test/extras/test_gaussian_pca.py test/extras/test_pca_numpy.py test/extras/test_count_numpy.py
      - name: Check out Bingham integration in decomposition2
        run: |
          git fetch --no-tags --depth=1 origin 5fbfc9b0be7527c5d15e1a8639978333fc84303b
          git reset --hard FETCH_HEAD
      - name: Test Bingham integration in decomposition2
        run: |
          cd python
          python -m pytest -v test/extras/test_pca2_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out scale-based Bingham
        run: |
          git fetch --no-tags --depth=1 origin f0e0a1b7cb1a18742bf962b88d3a1db5beae117f
          git reset --hard FETCH_HEAD
      - name: Test scale-based Bingham
        run: |
          cd python
          python -m pytest -v test/extras/test_pca2_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out unknown-size Bingham
        run: |
          git fetch --no-tags --depth=1 origin a38dbbd16bddb7b6f0a572da853efe05ce049745
          git reset --hard FETCH_HEAD
      - name: Test unknown-size Bingham
        run: |
          cd python
          python -m pytest -v test/extras/test_pca2_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Check out certified Bingham
        run: |
          git fetch --no-tags --depth=1 origin 3972f1a684f0831dcd2885d013ced95fa7f435df
          git reset --hard FETCH_HEAD
      - name: Rebuild for certified Bingham
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Test certified Bingham
        run: |
          cd python
          python -m pytest -v test/extras/test_pca2_numpy.py test/extras/test_gaussian_pca.py test/extras/test_eigenvector_numpy.py test/extras/test_eigenvalues_numpy.py test/extras/test_xTx_numpy.py test/extras/test_ext_domains_numpy.py test/extras/test_svec_numpy.py test/extras/test_count_numpy.py
      - name: Test certified sampler
        run: |
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib bingham
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib karney
