name: Test and benchmark certified Bingham sampler

on:
  push:
    paths:
      - '.github/workflows/pca-certified-bingham.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (Karney versus ratio-of-uniforms)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENDP_TEST_RELEASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: opendp/opendp
          ref: 99ddd328ef71bf577a87b6af5b812e3da5b7258a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test ratio-of-uniforms sampler
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::bingham
      - name: Measure lazy standard normal generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("rust/src/traits/samplers/bingham/mod.rs")
          p.write_text(p.read_text() + """
          #[cfg(test)]
          #[test]
          #[ignore]
          fn benchmark_lazy_normal() -> Fallible<()> {
              let n = 10000;
              let start = std::time::Instant::now();
              for _ in 0..n {
                  std::hint::black_box(normal()?);
              }
              println!("BENCH lazy-normal n={} mean_us={:.3}", n, start.elapsed().as_secs_f64() * 1e6 / n as f64);
              Ok(())
          }
          """)
          PY
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib benchmark_lazy_normal -- --ignored --nocapture
      - name: Build generated Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Install Python test dependencies
        run: python -m pip install -e 'python[scikit-learn]' pytest
      - name: Benchmark ratio-of-uniforms sampler
        shell: bash
        run: |
          lscpu | grep -E 'Model name|CPU\(s\):' || true
          cat >/tmp/bench_bingham.py <<'PY'
          import statistics
          import sys
          import time
          import numpy as np
          from opendp.extras.sklearn._make_eigenvector import _optimal_b, _sample_bingham

          d, spread = map(int, sys.argv[1:])
          rng = np.random.default_rng(42)
          q, _ = np.linalg.qr(rng.normal(size=(d, d)))
          c = (q * np.linspace(0, spread, d)) @ q.T
          c = (c + c.T) / 2

          def floating_reference():
              eigenvalues, q = np.linalg.eigh(c - c[0, 0] * np.eye(d))
              a = eigenvalues[-1] - eigenvalues
              b = _optimal_b(a, d)
              while True:
                  z = rng.normal(size=d) / np.sqrt(b + 2 * a)
                  u = z / np.linalg.norm(z)
                  x = np.dot(b + 2 * a, u ** 2) / d
                  if np.log(rng.random()) <= d / 2 * (np.log(x) + 1 - x):
                      return q @ u

          for name, sample, n in [
              ("float-reference", floating_reference, 20),
              ("certified", lambda: _sample_bingham(c, 1.0), 5 if d <= 128 else 3),
          ]:
              timings = []
              for _ in range(n):
                  start = time.perf_counter()
                  result = np.asarray(sample())
                  timings.append(1000 * (time.perf_counter() - start))
                  assert np.isfinite(result).all()
                  assert abs(np.linalg.norm(result) - 1) < 1e-12
              print(f"BENCH {name} d={d} spread={spread} n={n} median_ms={statistics.median(timings):.3f} max_ms={max(timings):.3f}", flush=True)
          PY
          for d in 2 8 24 64 128 256 512 1024; do
            for spread in 1 1000; do
              if timeout 180s python /tmp/bench_bingham.py "$d" "$spread"; then
                :
              else
                status=$?
                if [ "$status" -ne 124 ]; then exit "$status"; fi
                echo "BENCH timeout d=$d spread=$spread"
              fi
            done
          done
      - name: Run complete PCA and eigenvector test files
        run: |
          cd python
          python -m pytest -v test/extras/test_eigenvector_numpy.py test/extras/test_pca_numpy.py
      - name: Check out Karney candidate
        run: |
          git fetch --no-tags --depth=1 origin 891e73c9bccfcdb1206da76427a138f0be78af93
          git reset --hard FETCH_HEAD
      - name: Test Karney sampler
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::karney
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::bingham
      - name: Measure lazy standard normal generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("rust/src/traits/samplers/bingham/mod.rs")
          p.write_text(p.read_text() + """
          #[cfg(test)]
          #[test]
          #[ignore]
          fn benchmark_lazy_normal() -> Fallible<()> {
              let n = 10000;
              let start = std::time::Instant::now();
              for _ in 0..n {
                  std::hint::black_box(normal()?);
              }
              println!("BENCH lazy-normal n={} mean_us={:.3}", n, start.elapsed().as_secs_f64() * 1e6 / n as f64);
              Ok(())
          }
          """)
          PY
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib benchmark_lazy_normal -- --ignored --nocapture
      - name: Build Karney Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Benchmark Karney sampler
        shell: bash
        run: |
          for d in 2 8 24 64 128 256 512 1024; do
            for spread in 1 1000; do
              if timeout 180s python /tmp/bench_bingham.py "$d" "$spread"; then
                :
              else
                status=$?
                if [ "$status" -ne 124 ]; then exit "$status"; fi
                echo "BENCH timeout d=$d spread=$spread"
              fi
            done
          done
      - name: Test Karney PCA integration
        run: |
          cd python
          python -m pytest -v test/extras/test_eigenvector_numpy.py test/extras/test_pca_numpy.py
