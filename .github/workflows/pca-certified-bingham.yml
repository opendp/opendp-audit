name: Test and benchmark certified Bingham sampler

on:
  push:
    paths:
      - '.github/workflows/pca-certified-bingham.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        evaluation: [screened, direct]
    name: Native (shared norm, ${{ matrix.evaluation }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENDP_TEST_RELEASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: opendp/opendp
          ref: 65a09504d4c39bc9b5b80c75ffc3459d2008f66c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Benchmark direct evaluation without H (experimental variant)
        if: matrix.evaluation == 'direct'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("rust/src/traits/samplers/bingham/mod.rs")
          source = path.read_text()
          start = source.index("        let certified = approximate_diagonals")
          end = source.index("\n    }\n", start)
          source = source[:start] + """        let certified = (|| {
                      let p = ApproxMatrix::from_exact(&p)?;
                      let b = ApproxMatrix::from_exact(&factor)?;
                      b.transpose().multiply(&p.multiply(&b)?)?.diagonal_bounds()
                  })().filter(|g| g.iter().all(|r| r.lo > RBig::ZERO));
                  let g_diagonal = certified.unwrap_or_else(|| {
                      let (p, p_den) = integer_matrix(&p);
                      let (b, b_den) = integer_matrix(&factor);
                      let bt = transpose(&b);
                      let h_den = &b_den * &b_den;
                      let g = rationalize(matmul(&bt, &matmul(&p, &b)), &(&p_den * &h_den));
                      diagonal_bounds(&g)
                  });
                  Self::from_bounds(p, factor, g_diagonal, vec![])""" + source[end:]
          start = source.index("                            let squared: Vec<_>")
          end = source.index("                            match decision", start)
          source = source[:start] + """                            let z2 = norm_squared(&z_bounds);
                                      let projected = v.insert(project());
                                      let decision = self.decide(&quadratic(&self.precision, projected), &norm_squared(projected), &z2, &log_u, bits);
          """ + source[end:]
          path.write_text(source)
          PY
      - name: Test native sampler
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::bingham
      - name: Build generated Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Install Python test dependencies
        run: python -m pip install -e 'python[scikit-learn]' pytest
      - name: Benchmark complete sampler invocations
        shell: bash
        run: |
          lscpu | grep -E 'Model name|CPU\(s\):' || true
          cat >/tmp/bench_bingham.py <<'PY'
          import statistics
          import sys
          import time
          import numpy as np
          from opendp.extras.sklearn._make_eigenvector import _optimal_b, _sample_bingham

          d, spread = map(int, sys.argv[1:])
          rng = np.random.default_rng(42)
          q, _ = np.linalg.qr(rng.normal(size=(d, d)))
          c = (q * np.linspace(0, spread, d)) @ q.T
          c = (c + c.T) / 2

          def floating_reference():
              eigenvalues, q = np.linalg.eigh(c - c[0, 0] * np.eye(d))
              a = eigenvalues[-1] - eigenvalues
              b = _optimal_b(a, d)
              while True:
                  z = rng.normal(size=d) / np.sqrt(b + 2 * a)
                  u = z / np.linalg.norm(z)
                  x = np.dot(b + 2 * a, u ** 2) / d
                  if np.log(rng.random()) <= d / 2 * (np.log(x) + 1 - x):
                      return q @ u

          for name, sample, n in [
              ("float-reference", floating_reference, 20),
              ("certified", lambda: _sample_bingham(c, 1.0), 5 if d <= 128 else 3),
          ]:
              timings = []
              for _ in range(n):
                  start = time.perf_counter()
                  result = np.asarray(sample())
                  timings.append(1000 * (time.perf_counter() - start))
                  assert np.isfinite(result).all()
                  assert abs(np.linalg.norm(result) - 1) < 1e-12
              print(f"BENCH {name} d={d} spread={spread} n={n} median_ms={statistics.median(timings):.3f} max_ms={max(timings):.3f}", flush=True)
          PY
          for d in 2 8 24 64 128 256 512 1024; do
            for spread in 1 1000; do
              if timeout 180s python /tmp/bench_bingham.py "$d" "$spread"; then
                :
              else
                status=$?
                if [ "$status" -ne 124 ]; then exit "$status"; fi
                echo "BENCH timeout d=$d spread=$spread"
              fi
            done
          done
      - name: Run complete PCA and eigenvector test files
        run: |
          cd python
          python -m pytest -v test/extras/test_eigenvector_numpy.py test/extras/test_pca_numpy.py
