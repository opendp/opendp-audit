name: Verify Polars to_physical at pinned executor version

on:
  push:
    paths:
      - '.github/workflows/polars-to-physical.yml'
      - 'tools/integration/polars_to_physical_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-polars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Polars
        run: python -m pip install 'polars==1.36.1'
      - name: Test actual Polars executor
        run: python tools/integration/polars_to_physical_runtime.py
