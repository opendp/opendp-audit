name: Test certified Wishart stack

on:
  push:
    paths:
      - '.github/workflows/pca-certified-wishart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - name: Matrix foundation
            ref: c1a5467f854c48cd77ec9104e158cac9e16ec789
            tests: python/test/extras/test_ext_domains_numpy.py python/test/extras/test_xTx_numpy.py
          - name: Wishart mechanism
            ref: b8f36d369aeba9080bda799305e0826f80407557
            tests: python/test/extras/test_np_wishart.py
          - name: Shared SSCP
            ref: 35ac68e888136220f2f9dbbd986a501b9692ab86
            tests: python/test/extras/test_np_wishart.py python/test/extras/test_np_joint_moments.py python/test/extras/test_np_pca_moments.py python/test/extras/test_count_numpy.py python/test/extras/test_xTx_numpy.py python/test/extras/test_svec_numpy.py python/test/extras/test_sklearn_estimator.py
          - name: PCA
            ref: 98f70c605d31d2cba88360bb69b681d65a7a2656
            tests: python/test/extras/test_pca_numpy.py python/test/extras/test_gaussian_pca.py
          - name: Regression
            ref: a71b806d9a244d5ed9f1df0a6a7c8d9afad2ad25
            tests: python/test/extras/test_linear_regression_adassp.py
          - name: Combined certified estimators
            ref: b8f36d369aeba9080bda799305e0826f80407557
            tests: python/test/extras/test_np_pca_moments.py python/test/extras/test_pca_numpy.py python/test/extras/test_gaussian_pca.py python/test/extras/test_linear_regression_adassp.py
    env:
      OPENDP_LIB_DIR: ${{ github.workspace }}/rust/target/release
      OPENDP_TEST_RELEASE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: opendp/opendp
          ref: ${{ matrix.candidate.ref }}
          persist-credentials: false
          fetch-depth: 2
      - name: Merge sibling estimator branches for integration testing
        if: matrix.candidate.name == 'Combined certified estimators'
        env:
          PCA_REF: 98f70c605d31d2cba88360bb69b681d65a7a2656
          REGRESSION_REF: a71b806d9a244d5ed9f1df0a6a7c8d9afad2ad25
        run: |
          git fetch --depth=2 origin "$PCA_REF" "$REGRESSION_REF"
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-edit "$PCA_REF"
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-edit "$REGRESSION_REF"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Test Karney and Wishart sampling
        if: matrix.candidate.name == 'Wishart mechanism'
        run: |
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::karney
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::wishart
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Test layer
        env:
          TEST_FILES: ${{ matrix.candidate.tests }}
        run: |
          python -m pip install -e 'python[scikit-learn]' pytest
          python -m pytest -q $TEST_FILES
