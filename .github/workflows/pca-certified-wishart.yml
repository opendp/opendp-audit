name: Test certified Wishart sampler

on:
  push:
    paths:
      - '.github/workflows/pca-certified-wishart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.candidate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - name: Measurement
            ref: d1af2650a48492f126abcae372b9c7b3a285983b
            tests: python/test/extras/test_np_wishart.py
          - name: PCA
            ref: 0b8d9506f0e75460de0fb3e73bf7bb81118841db
            tests: python/test/extras/test_np_wishart.py python/test/extras/test_pca2_numpy.py python/test/extras/test_gaussian_pca.py
          - name: Regression
            ref: 38db4dfb2eb316295e98ba183259fc25d45b0c92
            tests: python/test/extras/test_np_wishart.py python/test/extras/test_linear_regression_adassp.py
    env:
      OPENDP_LIB_DIR: ${{ github.workspace }}/rust/target/release
      OPENDP_TEST_RELEASE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: opendp/opendp
          ref: ${{ matrix.candidate.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Test Karney and Wishart sampling
        run: |
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::karney
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::wishart
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Test joint measurement and estimator
        env:
          TEST_FILES: ${{ matrix.candidate.tests }}
        run: |
          python -m pip install -e 'python[scikit-learn]' pytest
          python -m pytest -q $TEST_FILES
