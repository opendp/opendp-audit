name: Test certified Wishart sampler

on:
  push:
    paths:
      - '.github/workflows/pca-certified-wishart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: opendp/opendp
          ref: 08aed79e7cbea195318c3ae037810070d1651691
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Test Karney and Wishart sampling
        run: |
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::karney
          cargo test --manifest-path rust/Cargo.toml --release --features untrusted,bindings --lib traits::samplers::wishart
      - name: Build Python bindings
        run: cargo build --manifest-path rust/Cargo.toml --release --features untrusted,bindings
      - name: Test joint measurement
        run: |
          python -m pip install -e 'python[scikit-learn]' pytest
          python -m pytest -q python/test/extras/test_np_wishart.py python/test/extras/test_pca2_numpy.py python/test/extras/test_gaussian_pca.py
