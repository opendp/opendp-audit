name: Verify duplicate Polars replace patterns

on:
  push:
    paths:
      - '.github/workflows/polars-replace-opendp.yml'
      - 'tools/integration/polars_replace_runtime.py'
      - 'tools/integration/polars_replace_open_dp.rs'
      - 'tools/integration/polars_replace_repaired_open_dp.rs'
      - 'tools/integration/polars_replace_range_open_dp.rs'
      - 'tools/integration/polars_replace_public_cast_probe.py'
      - 'tools/integration/patch_polars_replace_duplicate_keys.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-polars:
    name: Compiled Polars 1.36.1 executor behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Python Polars wheel
        run: python -m pip install 'polars==1.36.1'
      - name: Execute real Polars runtime regressions
        run: python tools/integration/polars_replace_runtime.py
      - name: Probe public replacement casts in compiled Polars
        run: python tools/integration/polars_replace_public_cast_probe.py

  pinned-opendp:
    name: Native OpenDP 0.16-dev and Polars integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - name: Checkout audit regression
        uses: actions/checkout@v4
      - name: Checkout pinned OpenDP
        uses: actions/checkout@v4
        with:
          repository: opendp/opendp
          ref: ef1a238634d6196b01a1a1e77d3d5ad2340e3094
          path: opendp-upstream
          persist-credentials: false
      - name: Confirm upstream SHA and install regression in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C opendp-upstream rev-parse HEAD)" = "ef1a238634d6196b01a1a1e77d3d5ad2340e3094"
          grep -Fq 'tag = "py-1.36.1"' opendp-upstream/rust/Cargo.toml
          mkdir -p opendp-upstream/rust/tests
          cp tools/integration/polars_replace_open_dp.rs opendp-upstream/rust/tests/
          cp tools/integration/polars_replace_range_open_dp.rs opendp-upstream/rust/tests/
      - name: Configure Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Execute native OpenDP and pinned Polars integration
        run: |
          cargo test --manifest-path opendp-upstream/rust/Cargo.toml \
            --no-default-features --features contrib,polars \
            --test polars_replace_open_dp -- --nocapture
      - name: Probe public Range literal handling in pinned native OpenDP
        run: |
          cargo test --manifest-path opendp-upstream/rust/Cargo.toml \
            --no-default-features --features contrib,polars \
            --test polars_replace_range_open_dp -- --nocapture
      - name: Apply public-key validation patch in ephemeral checkout only
        shell: bash
        run: |
          set -euo pipefail
          python tools/integration/patch_polars_replace_duplicate_keys.py \
            opendp-upstream/rust/src/transformations/make_stable_expr/expr_replace/mod.rs
          cp tools/integration/polars_replace_repaired_open_dp.rs \
            opendp-upstream/rust/tests/
      - name: Verify repaired OpenDP constructor and valid-key controls
        run: |
          cargo test --manifest-path opendp-upstream/rust/Cargo.toml \
            --no-default-features --features contrib,polars \
            --test polars_replace_repaired_open_dp -- --nocapture
