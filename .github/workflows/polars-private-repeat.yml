name: Probe private repeat errors in Polars group-by

on:
  push:
    paths:
      - '.github/workflows/polars-private-repeat.yml'
      - 'tools/integration/polars_private_repeat_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'opendp==0.16.0a20261122001' 'polars==1.36.1'
      - run: python -u tools/integration/polars_private_repeat_probe.py
